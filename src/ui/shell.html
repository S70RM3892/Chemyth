<div id="app" class="in-title">
  <canvas id="cv" aria-label="工場の地図"></canvas>
  <canvas id="gl" aria-hidden="true" hidden></canvas>
  <canvas id="minimap" hidden aria-label="全体の小地図。押すとその場所へ移る"></canvas>
  <div id="marks" hidden><button type="button" id="mark-0" aria-label="場所 1 へ移る（長押しで、いまの場所を覚える）">場所1</button><button type="button" id="mark-1" aria-label="場所 2 へ移る（長押しで、いまの場所を覚える）">場所2</button><button type="button" id="mini-size" aria-label="小地図の大きさを切り替える">⤢</button></div>
  <div id="paused" hidden>停止中<span class="muted">　Space か「停止中」で再開</span></div>
  <section id="goal" role="button" tabindex="0" aria-label="指令。押すと章の一覧が開く">
    <div class="goal-top"><span id="goal-step"></span><span id="goal-count"></span><button type="button" id="goal-fold" aria-label="指令をたたむ">▴</button></div>
    <div class="goal-main"><canvas id="goal-ico" width="88" height="88"></canvas><strong id="goal-name"></strong></div>
    <div class="track"><div id="goal-bar"></div></div>
    <p id="goal-rate"></p>
    <p id="goal-hint"></p>
    <p id="goal-side" hidden></p>
  </section>
  <section id="closing" hidden aria-live="polite">
    <div class="shutter"></div>
    <div class="closing-plate">
      <b id="closing-title">本日の操業終了</b>
      <p id="closing-text"></p>
      <div class="row"><button type="button" id="closing-title-btn" class="primary">タイトルへ</button><button type="button" id="closing-extend" class="ghost">15 分だけ延長（今夜 1 回だけ）</button></div>
    </div>
  </section>
  <section id="rvcard" hidden aria-live="polite">
    <div class="rv-top"><b>復習</b><span id="rvcard-left" class="muted"></span><span class="grow"></span><button type="button" id="rvcard-later" class="ghost">5 分あとで</button><button type="button" id="rvcard-close" class="ghost" aria-label="閉じる">×</button></div>
    <div id="rvcard-body"></div>
  </section>
  <div id="topbtns">
    <button type="button" id="b-undo" aria-label="元に戻す（2 本指で軽くたたいても戻る）">↶<span class="wide"> 元に戻す</span></button>
    <button type="button" id="b-redo" aria-label="やり直す（3 本指で軽くたたいても）" hidden>↷</button>
    <button type="button" id="b-floor" hidden>1 階</button>
    <button type="button" id="b-fit">全体</button>
    <button type="button" id="b-speed">▶ ×1</button>
    <button type="button" id="b-night" hidden>今夜の 10 問</button>
    <button type="button" id="b-review">復習 <span id="due"></span></button>
    <button type="button" id="b-up">強化 <span id="pts">0</span></button>
    <button type="button" id="b-stats">統計</button>
    <button type="button" id="b-book">図鑑</button>
    <button type="button" id="b-menu">メニュー<i id="sync-dot" hidden></i></button>
  </div>
  <div id="area-act" hidden>
    <span id="area-n"></span>
    <button type="button" id="area-all">画面全体</button>
    <button type="button" id="area-copy">コピー</button>
    <button type="button" id="area-del">まとめて消す</button>
    <button type="button" id="area-num">番号を振る</button>
    <span class="nudge" id="area-nudge"><button type="button" id="area-left" aria-label="左へずらす">←</button><button type="button" id="area-up" aria-label="上へずらす">↑</button><button type="button" id="area-down" aria-label="下へずらす">↓</button><button type="button" id="area-right" aria-label="右へずらす">→</button></span>
    <button type="button" id="area-rot">↻ 回す</button>
    <button type="button" id="area-put">ここに置く</button>
    <button type="button" id="area-save">保存</button>
    <button type="button" id="area-lib">設計図</button>
    <button type="button" id="area-cancel">やめる</button>
  </div>
  <p id="act-note" hidden></p>
  <div id="act" hidden>
    <button type="button" id="act-open">設定</button>
    <button type="button" id="act-turn" aria-label="向きを変える">↻</button>
    <button type="button" id="act-move" aria-label="ずらす（長押しして指を動かしてもずらせる）">⇲</button>
    <button type="button" id="act-copy" aria-label="同じ設定でコピーして貼る"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"></rect><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"></path></svg></button>
    <button type="button" id="act-erase" aria-label="消す">✕</button>
  </div>
  <div id="toast" role="status" hidden></div>
  <div id="stamp" hidden></div>
  <div id="dock">
    <p id="tip" hidden></p>
    <div id="bar">
      <nav id="tools" aria-label="道具"></nav>
      <div id="opts" hidden></div>
    </div>
  </div>
  <div id="modal" hidden><div id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
  <div id="title" hidden>
    <canvas id="title-bg"></canvas>
    <div id="title-inner">
      <div id="cover">
        <p class="kicker"><span class="note-only">受験化学の工場ノート</span><span class="punk-only">CHEMICAL WORKS ／ 受験化学</span><span class="arcane-only">錬金術師の実験録 ／ 受験化学</span></p>
        <p id="aspect"><span class="light">光の炉　DAYLIGHT FOUNDRY</span><span class="dark">闇の炉　NIGHT FURNACE</span></p>
        <h1><span>Chemyth</span></h1>
        <p class="lead">採って、分けて、反応させて、納める。</p>
        <div class="label-box"><span>科目</span><span>化学基礎・化学</span><span>範囲</span><span>共通テスト 〜 二次試験</span><span>内容</span><span>全 24 章 ／ 計算・復習・演習</span></div>
      </div>
      <div id="slots"></div>
      <button type="button" class="ghost" id="title-account" hidden></button>
      <div id="title-panel" hidden></div>
      <div class="row foot">
        <span class="seg" id="title-skin" role="group" aria-label="スキン"></span>
        <span class="seg" id="title-theme" role="group" aria-label="明暗"></span>
        <button type="button" class="ghost" id="title-sound">音：あり</button>
        <span class="muted">セーブはこの端末のこのブラウザの中に保存される。アカウントでログインすると、端末どうしで自動でそろう。</span>
      </div>
    </div>
  </div>
</div>
